    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {

    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        &lt;section class=&quot;block&quot; id=&quot;quick-note-block&quot; hidden&gt;&lt;div class=&quot;block-title&quot;&gt;&lt;i data-lucide=&quot;info&quot;&gt;&lt;/i&gt;Note&lt;/div&gt;&lt;p class=&quot;note&quot; id=&quot;quick-note&quot;&gt;&lt;/p&gt;&lt;/section&gt;
      &lt;/div&gt;
    &lt;/aside&gt;

    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i data-lucide=&quot;box&quot;&gt;&lt;/i&gt;Parent module&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;copy&quot;&gt;&lt;/i&gt;Existing data reused&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;plus-circle&quot;&gt;&lt;/i&gt;New data added&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;diamond&quot;&gt;&lt;/i&gt;Decision&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;settings-2&quot;&gt;&lt;/i&gt;Automatic work&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const r = (parent, tone, title, purpose, source, same, added, system, note = &#x27;&#x27;) =&gt; ({ parent, tone, title, purpose, source, same, added, system, note });
      const data = {
        masters: r(&#x27;Master Data &amp; Setup&#x27;,&#x27;primary&#x27;,&#x27;Reference Masters&#x27;,&#x27;Shared validated values used throughout both lifecycles.&#x27;,&#x27;Admin and master-data maintenance screens.&#x27;,[&#x27;No transaction data yet&#x27;],[&#x27;Vendor, client and subsidiary&#x27;,&#x27;Company users and rights&#x27;,&#x27;Product and HSN&#x27;,&#x27;Ports&#x27;,&#x27;Banks and AD codes&#x27;,&#x27;Import licenses / scripts&#x27;],&#x27;Supplies consistent IDs and selectable values to Purchase, Sales, Finance and Logistics. User rights control maker / approver behavior and notification routing.&#x27;),
        po: r(&#x27;Purchase Module&#x27;,&#x27;accent&#x27;,&#x27;Purchase Order (PO)&#x27;,&#x27;The complete commercial source document for the Purchase &amp; Import lifecycle.&#x27;,&#x27;Manual multi-step form, saved draft, validated Excel bulk upload, or ERP / Caliber synchronization.&#x27;,[&#x27;Organization and company context&#x27;,&#x27;Company code and subsidiary reference&#x27;,&#x27;Vendor master ID, code, name, address, contact and country&#x27;,&#x27;Business-head / company-user reference&#x27;,&#x27;Product master ID, name and category&#x27;,&#x27;HSN master ID, code, description and category&#x27;,&#x27;Bill-to and ship-to party references&#x27;,&#x27;Port of loading / discharge names and codes&#x27;],[&#x27;PO number and PO date&#x27;,&#x27;Business head and risk-on-account&#x27;,&#x27;Vendor / subsidiary selection and transaction snapshot&#x27;,&#x27;Country of origin, product category and specification&#x27;,&#x27;Additional HSN description and unit of measure&#x27;,&#x27;Ordered quantity, rate and quantity tolerance&#x27;,&#x27;DGFT fees and custom-calculation choice&#x27;,&#x27;Currency, incoterm and delivery days&#x27;,&#x27;Bill-to / ship-to contacts and addresses&#x27;,&#x27;Notify-party details and final destination&#x27;,&#x27;Shipment method and container / bulk type&#x27;,&#x27;Freight, insurance and other charges&#x27;,&#x27;CHA, transport, shipping-line, surveyor and tank-terminal costs&#x27;,&#x27;Requested last-shipment and arrival dates / windows&#x27;,&#x27;Voyage time, shipping line and vessel&#x27;,&#x27;Estimated departure and arrival dates / windows&#x27;,&#x27;Advance, spot and credit amounts / percentages&#x27;,&#x27;Credit days, payment-term currency and payment terms&#x27;,&#x27;TT / DA type, sight / usance and LC number&#x27;,&#x27;Required documents&#x27;,&#x27;Remarks and central remarks&#x27;],&#x27;Validates and normalizes vendor, subsidiary, product / HSN and port references; calculates each line amount as quantity × rate; totals the PO amount and balance; initializes remaining and unconfirmed quantities; records creator, organization and pending approval state; creates the original PO history snapshot; initializes IMS, hedge and IDPMS flags; raises applicable payment notifications; and, after approval, creates or updates FX exposure and can auto-create the initial Shipment Schedule when shipping data exists.&#x27;,&#x27;PO is the first transaction document, so “Same data carried forward” means data reused from reference masters and session context. Bank master data is not directly added to the normal PO; banks enter later through LC, ORM, FX or PI Finance.&#x27;),
        poDecision: r(&#x27;Purchase Module&#x27;,&#x27;warning&#x27;,&#x27;PO approved?&#x27;,&#x27;The PO approval gate.&#x27;,&#x27;Submitted PO and current user rights.&#x27;,[&#x27;All PO fields&#x27;],[&#x27;Approval / rejection action&#x27;,&#x27;Remarks&#x27;,&#x27;Actor and timestamp&#x27;],&#x27;YES creates or enables the next purchase records and can create the first shipment schedule. NO returns the PO for correction or rejection.&#x27;),
        shipment: r(&#x27;Purchase Module&#x27;,&#x27;warning&#x27;,&#x27;Shipment Schedule&#x27;,&#x27;One shipping timeline reused across documents.&#x27;,&#x27;Approved PO first; later linked to OC and synchronized with PI and A&amp;C.&#x27;,[&#x27;PO / OC reference&#x27;,&#x27;Requested shipment and arrival dates&#x27;,&#x27;Ports&#x27;,&#x27;Product context&#x27;],[&#x27;Voyage time&#x27;,&#x27;Shipping line&#x27;,&#x27;Vessel&#x27;,&#x27;ETD and ETA&#x27;,&#x27;Date windows&#x27;,&#x27;Remarks&#x27;],&#x27;Validates ETA after ETD, avoids duplicate OC schedules, records history, and synchronizes date changes.&#x27;,&#x27;Code note: when shipping data exists, PO approval can auto-create this schedule before OC. OC later attaches itself to the existing PO schedule, so the displayed OC → Schedule order is the simpler user-facing sequence.&#x27;),
        oc: r(&#x27;Purchase Module&#x27;,&#x27;accent&#x27;,&#x27;Order Confirmation (OC)&#x27;,&#x27;Confirms all or part of an approved PO.&#x27;,&#x27;Approved PO and its remaining unconfirmed HSN quantities.&#x27;,[&#x27;PO ID / number&#x27;,&#x27;Vendor / subsidiary&#x27;,&#x27;Currency and incoterm&#x27;,&#x27;Product / HSN&#x27;,&#x27;Ordered quantity and rate&#x27;,&#x27;Ports&#x27;,&#x27;Payment terms&#x27;,&#x27;Required documents&#x27;,&#x27;Shipment request&#x27;],[&#x27;OC number and date&#x27;,&#x27;SAP PO number&#x27;,&#x27;Confirmed HSN quantity&#x27;,&#x27;Confirmed rate and amount&#x27;],&#x27;Checks tolerance, reduces PO unconfirmed quantity, promotes the shipment schedule, allocates FX exposure, and creates SAP PO integration data.&#x27;,&#x27;Partial-transaction note: one PO can produce multiple OCs. Any unconfirmed quantity remains available, and the backend can retain or create another schedule for that remaining quantity.&#x27;),
        ocDecision: r(&#x27;Purchase Module&#x27;,&#x27;warning&#x27;,&#x27;Full PO quantity confirmed?&#x27;,&#x27;Determines whether another OC is needed.&#x27;,&#x27;PO ordered quantity minus all confirmed OC quantities.&#x27;,[&#x27;PO / OC links&#x27;,&#x27;Remaining product / HSN quantity&#x27;],[&#x27;No new field; calculated result&#x27;],&#x27;YES continues the confirmed order. NO leaves the remaining quantity open for another OC and schedule.&#x27;,&#x27;Partial-transaction note: NO does not end the PO. The remaining quantity can continue through another OC, another linked schedule, and later invoices.&#x27;),
        pi: r(&#x27;Purchase Module&#x27;,&#x27;success&#x27;,&#x27;Purchase Invoice (PI)&#x27;,&#x27;Captures supplier invoice and shipping documents.&#x27;,&#x27;OC with linked PO and Shipment Schedule.&#x27;,[&#x27;PO / OC references&#x27;,&#x27;Vendor / subsidiary&#x27;,&#x27;Currency&#x27;,&#x27;Product / HSN&#x27;,&#x27;Confirmed quantity and rate&#x27;,&#x27;Payment terms&#x27;,&#x27;Ports&#x27;,&#x27;Required documents&#x27;,&#x27;Shipment dates&#x27;],[&#x27;Invoice number and date&#x27;,&#x27;Invoice HSN quantity&#x27;,&#x27;Gross / net FCY value&#x27;,&#x27;BL number and quantity&#x27;,&#x27;Shipped-on-board date&#x27;,&#x27;ETA&#x27;,&#x27;Bank reference&#x27;,&#x27;Invoice documents&#x27;],&#x27;Calculates remaining invoice / BL quantities, derives due date and balances, consumes OC quantity, updates FX, and sends the PI to finance.&#x27;,&#x27;Partial-transaction note: confirmed quantity can be consumed across multiple invoices and shipment records while remaining quantities are tracked.&#x27;),
        piDecision: r(&#x27;Purchase Module&#x27;,&#x27;warning&#x27;,&#x27;Invoice and BL valid?&#x27;,&#x27;Required validation before finance review.&#x27;,&#x27;PI values and linked OC / PO quantities.&#x27;,[&#x27;Confirmed HSN quantity&#x27;,&#x27;Invoice quantity&#x27;,&#x27;BL quantity&#x27;,&#x27;ETD / ETA&#x27;],[&#x27;No new field; validation result&#x27;],&#x27;YES continues when BL quantity does not exceed invoice quantity and ETA is not before shipped-on-board. NO requires correction.&#x27;),
        fx: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;primary&#x27;,&#x27;FX Exposure &amp; Hedging&#x27;,&#x27;Tracks foreign-currency risk as the obligation moves forward.&#x27;,&#x27;PO creates exposure; OC and PI receive allocated or remaining hedge balances.&#x27;,[&#x27;Currency&#x27;,&#x27;FCY value&#x27;,&#x27;PO / OC / PI references&#x27;],[&#x27;Hedge allocation&#x27;,&#x27;Hedge rate&#x27;,&#x27;Treasury reference&#x27;,&#x27;Used / remaining hedge balance&#x27;],&#x27;Creates and updates linked exposure records while commercial value moves from PO to OC to PI.&#x27;,&#x27;Placement note: FX is a parallel process that starts at PO and is updated through PO → OC → PI. It is not strictly a step that begins only after PI.&#x27;),
        financeReview: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;primary&#x27;,&#x27;PI Finance Review&#x27;,&#x27;Adds bank control to the purchase invoice.&#x27;,&#x27;Pending-finance PI and bank masters.&#x27;,[&#x27;PI reference&#x27;,&#x27;Vendor&#x27;,&#x27;Currency&#x27;,&#x27;Invoice value&#x27;,&#x27;Due date&#x27;],[&#x27;AD bank&#x27;,&#x27;AD code&#x27;,&#x27;Bank branch&#x27;,&#x27;IFSC&#x27;,&#x27;Finance action / remarks&#x27;],&#x27;Stores finance approval metadata. PI may remain pending BOE until the customs document exists.&#x27;,&#x27;Status note: even after Finance approval, the PI can remain PENDING_BOE when no Bill of Entry exists. BOE presence participates in the final PI status.&#x27;),
        financeDecision: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;warning&#x27;,&#x27;Finance approved?&#x27;,&#x27;Controls release to logistics.&#x27;,&#x27;PI and submitted finance details.&#x27;,[&#x27;PO / OC / PI data&#x27;,&#x27;Invoice value&#x27;,&#x27;Due date&#x27;,&#x27;Bank context&#x27;],[&#x27;Approval / rejection action&#x27;,&#x27;Actor and timestamp&#x27;],&#x27;YES allows A&amp;C processing; final PI status also considers BOE. NO sends finance data back for correction.&#x27;),
        lc: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;primary&#x27;,&#x27;Letter of Credit&#x27;,&#x27;Trade-finance cover linked to the PO and eligible OC / invoices.&#x27;,&#x27;Parent PO, unlinked OCs, vendor, currency and amount.&#x27;,[&#x27;PO / OC / PI references&#x27;,&#x27;Vendor&#x27;,&#x27;Currency&#x27;,&#x27;Purchase value&#x27;],[&#x27;LC number and type&#x27;,&#x27;Issuing bank&#x27;,&#x27;LC amount&#x27;,&#x27;Validity dates&#x27;,&#x27;LC terms&#x27;],&#x27;Links eligible OCs and invoices so LC information can be used in payment and finance processing.&#x27;,&#x27;Timing note: LC can begin from the PO or OC stage. It is optional and does not require PI Finance Review to occur first.&#x27;),
        orm: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;primary&#x27;,&#x27;ORM / Outward Remittance&#x27;,&#x27;Records advance or invoice payment.&#x27;,&#x27;Selected PO and / or PI balance, optional LC and FX exposure.&#x27;,[&#x27;PO / PI references&#x27;,&#x27;Vendor&#x27;,&#x27;Currency&#x27;,&#x27;Payable / advance balance&#x27;],[&#x27;Remittance amount&#x27;,&#x27;Purpose&#x27;,&#x27;Bank&#x27;,&#x27;Bank reference&#x27;,&#x27;Approval data&#x27;],&#x27;Maps ORM to PO / PI and updates used, paid and remaining amounts for reconciliation.&#x27;,&#x27;Timing note: ORM can be an advance remittance against a PO or a payment against a PI. It is optional and is not always created after PI Finance Review.&#x27;),
        bc: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;primary&#x27;,&quot;Buyer&#x27;s Credit&quot;,&#x27;Tracks short-term external finance for purchase invoices.&#x27;,&#x27;Eligible PI payable values and finance details.&#x27;,[&#x27;PI reference&#x27;,&#x27;Currency&#x27;,&#x27;Invoice amount&#x27;,&#x27;Due date&#x27;],[&#x27;Lender&#x27;,&#x27;Interest rate&#x27;,&#x27;Tenor&#x27;,&#x27;Maturity&#x27;,&#x27;Settlement / rollover&#x27;],&#x27;Links credit to invoices and updates settlement, rollover and remaining balances.&#x27;),
        cndn: r(&#x27;Finance &amp; Treasury Module&#x27;,&#x27;primary&#x27;,&#x27;Purchase Credit / Debit Note&#x27;,&#x27;Adjusts a purchase invoice value.&#x27;,&#x27;Purchase invoice, vendor, subsidiary and currency.&#x27;,[&#x27;Invoice ID / number&#x27;,&#x27;Vendor&#x27;,&#x27;Subsidiary&#x27;,&#x27;Currency&#x27;],[&#x27;Credit / debit type&#x27;,&#x27;Note number and date&#x27;,&#x27;Due date&#x27;,&#x27;Value&#x27;,&#x27;Exchange rate&#x27;,&#x27;Purpose&#x27;],&#x27;Uses maker / approver status and links the adjustment back to the invoice.&#x27;,&#x27;Ownership note: Purchase CN/DN is available from the Purchase module and is an optional PI-linked adjustment. It is shown here as a shared financial record, not as a mandatory Treasury step.&#x27;),
        anc: r(&#x27;Logistics &amp; Customs Module&#x27;,&#x27;warning&#x27;,&#x27;Assignment &amp; Clearing (A&amp;C)&#x27;,&#x27;Allocates cargo to a clearing route and CHA.&#x27;,&#x27;Finance-cleared PI, BL quantities, Shipment Schedule and available licenses.&#x27;,[&#x27;PI and invoice&#x27;,&#x27;BL details&#x27;,&#x27;Product / HSN&#x27;,&#x27;Vendor / subsidiary&#x27;,&#x27;Ports&#x27;,&#x27;Shipping dates&#x27;,&#x27;Bank details&#x27;],[&#x27;Route: HSS / HC / IB / FTWZ&#x27;,&#x27;Assigned quantity&#x27;,&#x27;Customer / destination&#x27;,&#x27;Container numbers&#x27;,&#x27;CHA details&#x27;,&#x27;Duty / payment choices&#x27;,&#x27;License / script&#x27;,&#x27;Remarks&#x27;],&#x27;Reduces PI remaining BL quantity, consumes license balance, syncs PI and schedule, and notifies the CHA when required.&#x27;),
        boe: r(&#x27;Logistics &amp; Customs Module&#x27;,&#x27;warning&#x27;,&#x27;Bill of Entry (BOE)&#x27;,&#x27;Records customs declaration and landed cost.&#x27;,&#x27;A&amp;C assignment and linked PI.&#x27;,[&#x27;PI / invoice&#x27;,&#x27;BL details&#x27;,&#x27;Product / HSN&#x27;,&#x27;Vendor / subsidiary&#x27;,&#x27;Ports&#x27;,&#x27;Assigned quantity&#x27;,&#x27;CHA&#x27;,&#x27;Selected licenses&#x27;],[&#x27;IGM and BOE numbers / dates&#x27;,&#x27;IEC&#x27;,&#x27;BOE quantity&#x27;,&#x27;Customs exchange value&#x27;,&#x27;Freight / insurance&#x27;,&#x27;Duty and taxes&#x27;,&#x27;Benefit / license allocation&#x27;,&#x27;CHA / transporter / surveyor costs&#x27;],&#x27;Updates BOE-based due date, consumes licenses, marks the A&amp;C BL as BOE-built, and updates PI status.&#x27;),
        boeDecision: r(&#x27;Logistics &amp; Customs Module&#x27;,&#x27;warning&#x27;,&#x27;BOE approved?&#x27;,&#x27;Customs-document approval gate.&#x27;,&#x27;Created BOE and maker / approver rights.&#x27;,[&#x27;PI / BL / customs data&#x27;,&#x27;Duty and cost values&#x27;],[&#x27;Approval / rejection action&#x27;,&#x27;Actor and timestamp&#x27;],&#x27;YES makes BOE evidence available for PI completion and compliance. NO keeps customs processing pending.&#x27;),
        license: r(&#x27;Logistics &amp; Customs Module&#x27;,&#x27;warning&#x27;,&#x27;License Ledger&#x27;,&#x27;Tracks import-license and script usage.&#x27;,&#x27;License master balances plus A&amp;C and BOE selections.&#x27;,[&#x27;License / script ID&#x27;,&#x27;Available balance&#x27;,&#x27;Transaction reference&#x27;],[&#x27;Allocated quantity / value&#x27;,&#x27;Usage source: A&amp;C or BOE&#x27;],&#x27;Posts usage entries, reduces remaining balance, and preserves traceability to the source transaction.&#x27;),
        cha: r(&#x27;Logistics &amp; Customs Module&#x27;,&#x27;warning&#x27;,&#x27;CHA Communication&#x27;,&#x27;Sends clearing instructions to the selected agent.&#x27;,&#x27;A&amp;C route, CHA details, BL and assignment information.&#x27;,[&#x27;Invoice / BL&#x27;,&#x27;Assignment route&#x27;,&#x27;Containers&#x27;,&#x27;Ports&#x27;,&#x27;CHA contact&#x27;],[&#x27;Notification event and timestamp&#x27;],&#x27;Emails the CHA for applicable In Bond, Home Consumption or FTWZ assignments.&#x27;),
        idpmsDecision: r(&#x27;Compliance &amp; Closure Module&#x27;,&#x27;warning&#x27;,&#x27;BOE and payment complete?&#x27;,&#x27;Checks readiness for import closure.&#x27;,&#x27;PO with PI, approved BOE and remittance / payment evidence.&#x27;,[&#x27;PO / PI identity&#x27;,&#x27;BOE evidence&#x27;,&#x27;ORM / payment evidence&#x27;,&#x27;Import value&#x27;],[&#x27;No new field; completion result&#x27;],&#x27;YES allows IDPMS closure. NO leaves the import pending BOE or finance completion.&#x27;,&#x27;Implementation note: this is a business-readiness decision shown for understanding. The current closure endpoint does not enforce BOE/payment completeness itself.&#x27;),
        idpms: r(&#x27;Compliance &amp; Closure Module&#x27;,&#x27;success&#x27;,&#x27;IDPMS Closure&#x27;,&#x27;Final import reconciliation.&#x27;,&#x27;IDPMS dashboard record built from PO and downstream evidence.&#x27;,[&#x27;PO reference&#x27;,&#x27;Invoice details&#x27;,&#x27;BOE evidence&#x27;,&#x27;ORM / payment evidence&#x27;,&#x27;Import value&#x27;],[&#x27;IDPMS closed flag&#x27;,&#x27;Closure remarks&#x27;],&#x27;Marks the PO as IDPMS-closed for import compliance and reporting.&#x27;,&#x27;Implementation note: the backend currently closes IDPMS by setting idpms_closed to true and saving remarks. It does not revalidate BOE and payment completeness during that operation.&#x27;),
        salesOrder: r(&#x27;Sales Module&#x27;,&#x27;accent&#x27;,&#x27;Sales Order (SO)&#x27;,&#x27;The commercial source document for the Sales &amp; Export lifecycle.&#x27;,&#x27;Client, product, company, bank and user masters.&#x27;,[&#x27;Client master&#x27;,&#x27;Product / HSN&#x27;,&#x27;Company / subsidiary&#x27;,&#x27;Currency and bank references&#x27;],[&#x27;SO number&#x27;,&#x27;Client and destination&#x27;,&#x27;Products and quantities&#x27;,&#x27;Rates and currency&#x27;,&#x27;Incoterm&#x27;,&#x27;Advance / spot / credit terms&#x27;,&#x27;Required documents&#x27;],&#x27;Creates the customer sales contract, tracks available quantities and provides the source for Sales Invoices.&#x27;,&#x27;Parallel-flow note: Sales Orders are independent from most Purchase Orders. HSS or FTWZ business can connect import-clearance records to Sales views when applicable.&#x27;),
        salesInvoice: r(&#x27;Sales Module&#x27;,&#x27;success&#x27;,&#x27;Sales Invoice&#x27;,&#x27;Creates the commercial export or domestic invoice against a Sales Order.&#x27;,&#x27;Approved or eligible Sales Order and client / product masters.&#x27;,[&#x27;SO reference&#x27;,&#x27;Client&#x27;,&#x27;Product / HSN&#x27;,&#x27;Quantity and rate&#x27;,&#x27;Currency&#x27;,&#x27;Collection terms&#x27;],[&#x27;Invoice number and date&#x27;,&#x27;Gross / net value&#x27;,&#x27;Packing list&#x27;,&#x27;Commercial invoice&#x27;,&#x27;Inspection / origin documents&#x27;,&#x27;Dispatch and transport documents&#x27;],&#x27;Creates the shared invoice record. Logistics and Finance later update their own sections on that same invoice.&#x27;),
        logisticsInvoice: r(&#x27;Sales Module&#x27;,&#x27;warning&#x27;,&#x27;Logistics Invoice Stage&#x27;,&#x27;Adds shipping and movement information to the existing Sales Invoice.&#x27;,&#x27;Sales Invoice and its Sales Order.&#x27;,[&#x27;Invoice / SO identity&#x27;,&#x27;Client and products&#x27;,&#x27;Invoice quantity and value&#x27;,&#x27;Collection terms&#x27;],[&#x27;Shipping bill details&#x27;,&#x27;Shipment / transport data&#x27;,&#x27;Logistics documents&#x27;,&#x27;BTT certificate when applicable&#x27;],&#x27;Updates the logistics section of the same invoice and can derive due dates from shipping-bill-based Sales Order terms.&#x27;,&#x27;This is not a second commercial invoice. It is the Logistics team completing its stage on the shared Sales Invoice record.&#x27;),
        salesFinance: r(&#x27;Sales Module&#x27;,&#x27;primary&#x27;,&#x27;Finance Invoice Stage&#x27;,&#x27;Adds finance approval and collection allocation to the Sales Invoice.&#x27;,&#x27;Sales and Logistics invoice stages plus eligible IRMs.&#x27;,[&#x27;Invoice / SO identity&#x27;,&#x27;Client&#x27;,&#x27;Invoice value and balance&#x27;,&#x27;Due date&#x27;,&#x27;Shipping information&#x27;],[&#x27;Advance eligibility&#x27;,&#x27;Finance action&#x27;,&#x27;Approval actor / time&#x27;,&#x27;Selected IRM allocations&#x27;],&#x27;Updates the finance section and can map existing IRM amounts to the invoice, reducing invoice and IRM available balances.&#x27;),
        salesFinanceDecision: r(&#x27;Sales Module&#x27;,&#x27;warning&#x27;,&#x27;Finance approved?&#x27;,&#x27;The final invoice finance approval gate.&#x27;,&#x27;Completed Sales and Logistics invoice data plus Finance details.&#x27;,[&#x27;Invoice&#x27;,&#x27;SO&#x27;,&#x27;Client&#x27;,&#x27;Value&#x27;,&#x27;Due date&#x27;,&#x27;Shipping and bank context&#x27;],[&#x27;Approval / rejection action&#x27;,&#x27;Actor and timestamp&#x27;],&#x27;YES makes the approved finance state available for export collection and reporting. NO returns Finance details for correction.&#x27;),
        salesCndn: r(&#x27;Sales Module&#x27;,&#x27;accent&#x27;,&#x27;Sales Credit / Debit Note&#x27;,&#x27;Optional adjustment against a Sales Invoice.&#x27;,&#x27;Sales Invoice, client, subsidiary and currency.&#x27;,[&#x27;Invoice identity&#x27;,&#x27;Client&#x27;,&#x27;Subsidiary&#x27;,&#x27;Currency&#x27;],[&#x27;Credit / debit type&#x27;,&#x27;Note number and date&#x27;,&#x27;Value&#x27;,&#x27;Exchange rate&#x27;,&#x27;Purpose&#x27;],&#x27;Uses maker / approver status and links the adjustment back to the Sales Invoice.&#x27;,&#x27;This is optional and should not be read as a mandatory step in every Sales lifecycle.&#x27;),
